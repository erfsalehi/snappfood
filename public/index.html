<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تخفیف‌های اسنپ‌فود — مرتب‌سازی</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #e8384f;
    --good: #14804a;
    --row-alt: #fafbfc;
    --head-top: 0px; /* set from JS to the sticky header's height */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --panel: #1c2024;
      --border: #2c3237;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --accent: #ff5f72;
      --good: #35c37d;
      --row-alt: #191d21;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 Vazirmatn, "Segoe UI", Tahoma, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }
  h1 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-inline-start: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .field { display: flex; align-items: center; gap: 5px; }
  .field > span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px;
  }
  input[type=number] { width: 92px; }
  input[type=search] { min-width: 190px; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); font-weight: 400; }
  label.check { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }

  /* On wide screens the wrapper must not form a box of its own, or its
     children stop participating in the toolbar's flex row and stack. */
  #filters { display: contents; }
  #filterToggle { display: none; }
  .spacer { flex: 1; }

  /* ---- status ---- */
  #status { padding: 7px 14px; color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #status b { color: var(--text); }
  #status.error { color: var(--accent); }
  #age { color: var(--muted); }
  #spin {
    display: none; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  body.refreshing #spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- table (wide screens) ---- */
  .wrap { padding: 0 14px 40px; }
  /* Deliberately no overflow here: any scroll container between the sticky
     <th> and the viewport silently cancels position:sticky. The card layout
     takes over below 1100px, so the table never needs to scroll sideways. */
  .scroller { border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th {
    position: sticky; top: var(--head-top); z-index: 2;
    background: var(--panel); cursor: pointer; user-select: none;
    font-size: 12px; color: var(--muted); font-weight: 600;
    border-bottom: 2px solid var(--border);
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  thead th .arrow { font-size: 9px; opacity: .85; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  td.name { white-space: normal; min-width: 170px; max-width: 320px; }
  td.vendor { white-space: normal; max-width: 190px; }
  /* Items belong to several sections; joined nowrap this column ran to
     ~290px and pushed the table past the viewport. */
  td.section { white-space: normal; max-width: 150px; font-size: 12px; color: var(--muted); }
  td.num { font-variant-numeric: tabular-nums; }

  .strike { color: var(--muted); text-decoration: line-through; font-size: 12px; }
  .pct { color: #fff; background: var(--accent); border-radius: 5px; padding: 1px 6px; font-size: 12px; font-weight: 700; }
  .free { color: var(--good); font-weight: 600; }
  .stars { color: #f0a92b; }
  .votes { color: var(--muted); font-size: 11px; }
  .thumb { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: var(--border); }
  a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .desc { color: var(--muted); font-size: 11px; display: block; white-space: normal; }
  .low { color: var(--accent); font-weight: 600; }

  /* ---- cards (small screens) ---- */
  #cards { display: none; }
  #sortBar { display: none; }

  @media (max-width: 1100px) {
    h1 small { display: none; }
    .wrap { padding: 0 10px 32px; }
    .scroller, table { display: none; }

    #cards { display: grid; gap: 8px; }
    #sortBar {
      display: flex; gap: 8px; align-items: center;
      position: sticky; top: var(--head-top); z-index: 4;
      background: var(--bg); padding: 8px 0; margin-bottom: 2px;
    }
    #sortBar select { flex: 1; min-width: 0; }
    #sortBar > span { color: var(--muted); font-size: 12px; }

    /* Collapse the filter block; the toggle reveals it. */
    #filterToggle { display: inline-block; }
    #filters {
      display: none !important; width: 100%;
      flex-wrap: wrap; gap: 8px 12px; align-items: center;
      padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--border);
    }
    body.filters-open #filters { display: flex !important; }
    .spacer { display: none; }
    input[type=search] { min-width: 0; flex: 1; }
    .field { flex: 1 1 auto; }
    input[type=number] { width: 100%; min-width: 70px; }

    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; display: grid;
      grid-template-columns: 54px 1fr; gap: 10px;
    }
    .card img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--border); }
    .card .body { min-width: 0; }
    .card .title { font-weight: 700; line-height: 1.35; }
    .card .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .card .prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .card .final { font-size: 17px; font-weight: 700; }
    .card .meta {
      margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px;
      font-size: 12px; color: var(--muted);
    }
    .card .meta b { color: var(--text); }
  }

</style>
</head>
<body>
<header>
  <h1>تخفیف‌های اسنپ‌فود <small>همه‌ی لیست‌های تخفیف‌دار، قابل مرتب‌سازی روی هر ستون</small></h1>
  <div class="controls">
    <div class="field"><span>شهر</span><select id="city"></select></div>
    <button class="ghost" id="geo" title="استفاده از موقعیت دقیق دستگاه">موقعیت من</button>
    <button id="refresh">به‌روزرسانی</button>
    <button class="ghost" id="filterToggle">فیلترها</button>
    <span class="spacer"></span>

    <div id="filters">
      <div class="field"><span>جست‌وجو</span><input id="q" type="search" placeholder="نام غذا یا رستوران…"></div>
      <div class="field"><span>بخش</span><select id="section"><option value="">همه</option></select></div>
      <div class="field"><span>حداقل امتیاز</span><input id="minRating" type="number" min="0" max="5" step="0.1" value="0"></div>
      <div class="field"><span>حداقل تخفیف ٪</span><input id="minPct" type="number" min="0" max="100" step="5" value="0"></div>
      <div class="field"><span>حداکثر پرداختی</span><input id="maxTotal" type="number" step="10000" placeholder="—"></div>
      <label class="check"><input id="freeOnly" type="checkbox"> ارسال رایگان</label>
      <label class="check"><input id="stockOnly" type="checkbox" checked> موجود</label>
      <div class="field"><span>عرض</span><input id="lat" type="number" step="0.0001" value="35.715"></div>
      <div class="field"><span>طول</span><input id="long" type="number" step="0.0001" value="51.404"></div>
      <label class="check"><input id="deep" type="checkbox"> جست‌وجوی کامل بخش‌ها</label>
      <button class="ghost" id="csv">دانلود CSV</button>
    </div>
  </div>
</header>

<div id="status"><span id="spin"></span><span id="summary">در حال دریافت…</span><span id="age"></span></div>

<div class="wrap">
  <!-- Sorting control for small screens, where there are no column headers. -->
  <div id="sortBar">
    <span>مرتب‌سازی</span>
    <select id="sortKey"></select>
    <button class="ghost" id="sortDir" title="تغییر جهت">▼</button>
  </div>

  <div class="scroller">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div id="cards"></div>
</div>

<script>
const COLUMNS = [
  { key: 'image',         label: '',              sortable: false },
  { key: 'name',          label: 'نام',            type: 'text' },
  { key: 'vendor',        label: 'رستوران',        type: 'text' },
  { key: 'section',       label: 'بخش',            type: 'text' },
  { key: 'rating',        label: 'امتیاز',         type: 'num' },
  { key: 'price',         label: 'قیمت اصلی',      type: 'num' },
  { key: 'finalPrice',    label: 'قیمت با تخفیف',  type: 'num' },
  { key: 'discountRatio', label: 'تخفیف ٪',        type: 'num' },
  { key: 'saving',        label: 'صرفه‌جویی',       type: 'num' },
  { key: 'deliveryNow',   label: 'هزینه ارسال',    type: 'num' },
  { key: 'total',         label: 'مجموع پرداختی',  type: 'num' },
  { key: 'minOrder',      label: 'حداقل سفارش',    type: 'num' },
  { key: 'remaining',     label: 'موجودی',         type: 'num' },
];

// Data older than this is refetched when the user touches a control - stock
// sells out and vendors pull items, so acting on a stale list wastes a trip
// to a sold-out deal.
const STALE_MS = 60000;
// Typing in the search box must not fire a request per keystroke: through a
// proxy each fetch costs ~20s.
const REFRESH_DEBOUNCE_MS = 800;

const fa = (n) => (n || 0).toLocaleString('fa-IR');
const $ = (id) => document.getElementById(id);
const narrow = window.matchMedia('(max-width: 1100px)');

let allItems = [];
let view = [];
let sort = { key: 'discountRatio', dir: -1 };
let fetching = false;
let lastFetch = 0;
let refreshTimer = null;
let ageTimer = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---- sticky header offset --------------------------------------------------

// The toolbar is sticky and its height changes with wrapping and with the
// filter panel opening, so the table headers cannot use a fixed offset.
const headerEl = document.querySelector('header');
function syncHeaderOffset() {
  document.documentElement.style.setProperty('--head-top', headerEl.offsetHeight + 'px');
}
new ResizeObserver(syncHeaderOffset).observe(headerEl);
window.addEventListener('orientationchange', syncHeaderOffset);
syncHeaderOffset();

// ---- rendering -------------------------------------------------------------

function renderHead() {
  $('head').innerHTML = COLUMNS.map((c) => {
    if (c.sortable === false) return '<th></th>';
    const active = sort.key === c.key;
    const arrow = active ? ' <span class="arrow">' + (sort.dir === 1 ? '▲' : '▼') + '</span>' : '';
    return '<th class="' + (active ? 'sorted' : '') + '" data-key="' + c.key + '">' + c.label + arrow + '</th>';
  }).join('');

  for (const th of $('head').querySelectorAll('th[data-key]')) {
    th.onclick = () => setSort(th.dataset.key);
  }
}

function stars(r) {
  if (!r) return '<span class="votes">—</span>';
  return '<span class="stars">★</span> ' + r.toFixed(1);
}

function deliveryHtml(it) {
  if (it.deliveryNow === 0) return '<span class="free">رایگان</span>';
  return fa(it.deliveryNow) + (it.deliveryDiscounted ? ' <span class="strike">' + fa(it.deliveryFee) + '</span>' : '');
}

function stockHtml(it) {
  // A low count is the thing most likely to change before you can order.
  return it.remaining > 0 && it.remaining <= 2
    ? '<span class="low">' + fa(it.remaining) + '</span>'
    : fa(it.remaining);
}

function renderTable() {
  $('body').innerHTML = view.map((it) => {
    const thumb = it.image ? '<img class="thumb" loading="lazy" src="' + it.image + '" alt="">' : '';
    const desc = it.description ? '<span class="desc">' + esc(it.description.slice(0, 90)) + '</span>' : '';
    return '<tr>'
      + '<td>' + thumb + '</td>'
      + '<td class="name"><a href="' + it.url + '" target="_blank" rel="noopener">' + esc(it.name) + '</a>' + desc + '</td>'
      + '<td class="vendor"><a href="' + it.url + '" target="_blank" rel="noopener">' + esc(it.vendor) + '</a></td>'
      + '<td class="section">' + esc(it.sections.join(' / ')) + '</td>'
      + '<td class="num">' + stars(it.rating) + ' <span class="votes">(' + fa(it.votes) + ')</span></td>'
      + '<td class="num strike">' + fa(it.price) + '</td>'
      + '<td class="num"><b>' + fa(it.finalPrice) + '</b></td>'
      + '<td class="num"><span class="pct">٪' + fa(it.discountRatio) + '</span></td>'
      + '<td class="num">' + fa(it.saving) + '</td>'
      + '<td class="num">' + deliveryHtml(it) + '</td>'
      + '<td class="num"><b>' + fa(it.total) + '</b></td>'
      + '<td class="num">' + fa(it.minOrder) + '</td>'
      + '<td class="num">' + stockHtml(it) + '</td>'
      + '</tr>';
  }).join('');
}

function renderCards() {
  $('cards').innerHTML = view.map((it) => {
    const img = it.image ? '<img loading="lazy" src="' + it.image + '" alt="">' : '<img alt="">';
    return '<a class="card" href="' + it.url + '" target="_blank" rel="noopener">'
      + img
      + '<div class="body">'
      +   '<div class="title">' + esc(it.name) + '</div>'
      +   '<div class="sub">' + esc(it.vendor) + '</div>'
      +   '<div class="prices">'
      +     '<span class="pct">٪' + fa(it.discountRatio) + '</span>'
      +     '<span class="strike">' + fa(it.price) + '</span>'
      +     '<span class="final">' + fa(it.finalPrice) + '</span>'
      +   '</div>'
      +   '<div class="meta">'
      +     '<span>' + stars(it.rating) + ' <span class="votes">(' + fa(it.votes) + ')</span></span>'
      +     '<span>ارسال: <b>' + deliveryHtml(it) + '</b></span>'
      +     '<span>مجموع: <b>' + fa(it.total) + '</b></span>'
      +     '<span>موجودی: <b>' + stockHtml(it) + '</b></span>'
      +   '</div>'
      + '</div></a>';
  }).join('');
}

function renderRows() {
  if (narrow.matches) renderCards();
  else renderTable();
}

// ---- sorting ---------------------------------------------------------------

function setSort(key) {
  const col = COLUMNS.find((c) => c.key === key);
  // Numbers start high-to-low, text starts alphabetical.
  if (sort.key === key) sort.dir *= -1;
  else sort = { key, dir: col && col.type === 'num' ? -1 : 1 };
  apply();
}

function syncSortBar() {
  $('sortKey').value = sort.key;
  $('sortDir').textContent = sort.dir === 1 ? '▲' : '▼';
}

$('sortKey').innerHTML = COLUMNS
  .filter((c) => c.sortable !== false)
  .map((c) => '<option value="' + c.key + '">' + c.label + '</option>')
  .join('');
$('sortKey').onchange = () => {
  const col = COLUMNS.find((c) => c.key === $('sortKey').value);
  sort = { key: $('sortKey').value, dir: col && col.type === 'num' ? -1 : 1 };
  apply();
};
$('sortDir').onclick = () => { sort.dir *= -1; apply(); };

// ---- filtering -------------------------------------------------------------

function apply() {
  const q = $('q').value.trim().toLowerCase();
  const section = $('section').value;
  const minRating = Number($('minRating').value) || 0;
  const minPct = Number($('minPct').value) || 0;
  const maxTotal = Number($('maxTotal').value) || Infinity;
  const freeOnly = $('freeOnly').checked;
  const stockOnly = $('stockOnly').checked;

  view = allItems.filter((it) => {
    if (q && !(it.name + ' ' + it.vendor).toLowerCase().includes(q)) return false;
    if (section && !it.sections.includes(section)) return false;
    if (it.rating < minRating) return false;
    if (it.discountRatio < minPct) return false;
    if (it.total > maxTotal) return false;
    if (freeOnly && it.deliveryNow !== 0) return false;
    if (stockOnly && it.remaining <= 0) return false;
    return true;
  });

  const { key, dir } = sort;
  const col = COLUMNS.find((c) => c.key === key);
  view.sort((a, b) => {
    if (col && col.type === 'text') {
      const av = key === 'section' ? a.sections.join(' ') : a[key];
      const bv = key === 'section' ? b.sections.join(' ') : b[key];
      return dir * String(av).localeCompare(String(bv), 'fa');
    }
    return dir * ((a[key] || 0) - (b[key] || 0));
  });

  renderHead();
  syncSortBar();
  renderRows();
  updateSummary();
}

// Any adjustment re-filters instantly from memory, and separately asks for
// fresh data if what we hold has gone stale.
function onAdjust() {
  apply();
  scheduleRefresh();
}

// ---- status ----------------------------------------------------------------

function updateSummary() {
  const saved = view.reduce((s, it) => s + it.saving, 0);
  $('status').className = '';
  $('summary').innerHTML = '<b>' + fa(view.length) + '</b> مورد از <b>' + fa(allItems.length)
    + '</b> — جمع صرفه‌جویی: <b>' + fa(saved) + '</b> تومان';
}

function updateAge() {
  if (!lastFetch) { $('age').textContent = ''; return; }
  const secs = Math.round((Date.now() - lastFetch) / 1000);
  const label = secs < 60
    ? 'چند لحظه پیش'
    : Math.round(secs / 60) + ' دقیقه پیش';
  $('age').textContent = '· به‌روزرسانی ' + label;
}

// ---- data ------------------------------------------------------------------

async function load(opts) {
  const background = opts && opts.background;
  if (fetching) return;
  fetching = true;
  document.body.classList.add('refreshing');
  $('refresh').disabled = true;
  if (!background) {
    $('status').className = '';
    $('summary').textContent = 'در حال دریافت…';
  }

  const scrollY = window.scrollY;
  try {
    const params = new URLSearchParams({ lat: $('lat').value, long: $('long').value });
    if ($('deep').checked) params.set('deep', '1');
    const res = await fetch('/api/deals?' + params);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'خطا در دریافت');

    allItems = data.items;
    lastFetch = Date.now();

    const titles = [...new Set(data.sections.map((s) => s.title))].sort((a, b) => a.localeCompare(b, 'fa'));
    const current = $('section').value;
    $('section').innerHTML = '<option value="">همه</option>'
      + titles.map((t) => '<option>' + esc(t) + '</option>').join('');
    if (titles.includes(current)) $('section').value = current;

    localStorage.setItem('sf-loc', JSON.stringify({ lat: $('lat').value, long: $('long').value }));
    apply();
    updateAge();
    // A background refresh must not yank the page out from under the reader.
    if (background) window.scrollTo(0, scrollY);
  } catch (err) {
    $('status').className = 'error';
    $('summary').textContent = 'خطا: ' + err.message;
  } finally {
    fetching = false;
    document.body.classList.remove('refreshing');
    $('refresh').disabled = false;
  }
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    if (Date.now() - lastFetch > STALE_MS) load({ background: true });
  }, REFRESH_DEBOUNCE_MS);
}

function toCsv() {
  const cols = COLUMNS.filter((c) => c.key !== 'image');
  const rows = [cols.map((c) => c.label).concat('لینک')];
  for (const it of view) {
    rows.push(cols.map((c) => (c.key === 'section' ? it.sections.join(' / ') : it[c.key])).concat(it.url));
  }
  // BOM so Excel reads the UTF-8 Persian text correctly.
  const csv = '﻿' + rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'snappfood-deals.csv';
  a.click();
}

// ---- location --------------------------------------------------------------

// City centres. Snappfood scopes deals to a delivery radius, so a centre point
// is only an approximation - use "موقعیت من" for your actual neighbourhood.
const CITIES = [
  ['تهران', 35.715, 51.404],
  ['مشهد', 36.2972, 59.6067],
  ['اصفهان', 32.6546, 51.668],
  ['شیراز', 29.5918, 52.5837],
  ['تبریز', 38.08, 46.2919],
  ['کرج', 35.8355, 50.9915],
  ['اهواز', 31.3183, 48.6706],
  ['قم', 34.6416, 50.8746],
  ['رشت', 37.2808, 49.5832],
  ['کرمانشاه', 34.3142, 47.065],
  ['ارومیه', 37.5527, 45.0761],
  ['یزد', 31.8974, 54.3569],
  ['کرمان', 30.2839, 57.0834],
  ['بندرعباس', 27.1865, 56.2808],
  ['ساری', 36.5633, 53.06],
];

function syncCitySelect() {
  const lat = Number($('lat').value);
  const long = Number($('long').value);
  const near = CITIES.find((c) => Math.abs(c[1] - lat) < 0.001 && Math.abs(c[2] - long) < 0.001);
  $('city').value = near ? near[0] : '';
}

$('city').innerHTML = '<option value="">دلخواه</option>'
  + CITIES.map((c) => '<option>' + c[0] + '</option>').join('');

$('city').onchange = () => {
  const c = CITIES.find((x) => x[0] === $('city').value);
  if (!c) return;
  $('lat').value = c[1];
  $('long').value = c[2];
  load(); // a different location is different data, not a filter
};

for (const id of ['lat', 'long']) $(id).addEventListener('input', syncCitySelect);

$('geo').onclick = () => {
  if (!navigator.geolocation) {
    $('status').className = 'error';
    $('summary').textContent = 'مرورگر از موقعیت‌یابی پشتیبانی نمی‌کند.';
    return;
  }
  $('status').className = '';
  $('summary').textContent = 'در حال یافتن موقعیت…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      $('lat').value = pos.coords.latitude.toFixed(4);
      $('long').value = pos.coords.longitude.toFixed(4);
      syncCitySelect();
      load();
    },
    (err) => {
      $('status').className = 'error';
      $('summary').textContent = 'دسترسی به موقعیت ممکن نشد: ' + err.message;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

// ---- wiring ----------------------------------------------------------------

for (const id of ['q', 'section', 'minRating', 'minPct', 'maxTotal', 'freeOnly', 'stockOnly']) {
  $(id).addEventListener('input', onAdjust);
}
$('deep').addEventListener('change', () => load());
$('refresh').onclick = () => load();
$('csv').onclick = toCsv;
$('filterToggle').onclick = () => {
  document.body.classList.toggle('filters-open');
  syncHeaderOffset();
};

// Switching between table and cards needs a re-render, not just new CSS.
narrow.addEventListener('change', () => { renderRows(); syncHeaderOffset(); });

// Coming back to the tab after a while should not show yesterday's stock.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastFetch > STALE_MS) load({ background: true });
});

ageTimer = setInterval(updateAge, 15000);

try {
  const saved = JSON.parse(localStorage.getItem('sf-loc') || 'null');
  if (saved) { $('lat').value = saved.lat; $('long').value = saved.long; }
} catch (e) { /* ignore bad cache */ }
syncCitySelect();

renderHead();
syncSortBar();
load();
</script>
</body>
</html>
